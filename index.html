    <!-- Antes da primeira pintura: sem isso o tema claro pisca no modo escuro. -->
    <script>
      (function () {
        var s = localStorage.getItem('theme');
        var dark = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';

        // Contraparte do public/404.html: restaura o deep link antes do React
        // montar, para o router já iniciar na rota certa.
        var rota = sessionStorage.getItem('rota');
        if (rota) {
          sessionStorage.removeItem('rota');
          history.replaceState(null, '', rota);
        }
      })();
    </script>
